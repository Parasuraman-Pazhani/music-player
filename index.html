<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player-container">
    <!-- Album Artwork -->
    <div class="artwork-wrapper">
      <img id="track-art" src="assets/covers/song1.jpg" alt="Album Art" />
    </div>

    <!-- Track Information -->
    <div class="track-info">
      <h2 id="track-title">Track Title</h2>
      <p id="track-artist">Artist Name</p>
    </div>

    <!-- Progress Bar & Timestamps -->
    <div class="progress-section">
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="total-duration">0:00</span>
      </div>
      <input type="range" id="progress-bar" min="0" max="100" value="0" />
    </div>

    <!-- Playback Controls -->
    <div class="controls">
      <button id="prev-btn" class="ctrl-btn" title="Previous Track">⏮</button>
      <button id="play-btn" class="ctrl-btn main-btn" title="Play/Pause">▶</button>
      <button id="next-btn" class="ctrl-btn" title="Next Track">⏭</button>
    </div>

    <!-- Volume Slider -->
    <div class="volume-section">
      <span>🔈</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
      <span>🔊</span>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="audio-element"></audio>

  <script src="app.js"></script>
</body>
</html>
